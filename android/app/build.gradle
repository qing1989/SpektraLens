plugins { id 'com.android.application' }

android {
    namespace 'app.spektrafilm'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'app.spektrafilm'
        minSdk 29
        targetSdk 35
        versionCode 18
        versionName '0.3.9'
        // Default ships arm64 only: the x86_64 SwiftShader ICD alone is 22 MB and phones never use
        // it. Emulator builds pass -Pabis=arm64-v8a,x86_64.
        def abiList = (findProperty('abis') ?: 'arm64-v8a').toString().split(',') as List
        ndk { abiFilters(*abiList) }
        externalNativeBuild { cmake { cppFlags '-std=c++20 -fexceptions -frtti'; arguments '-DANDROID_STL=c++_static' } }
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    packaging { jniLibs { useLegacyPackaging true } }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    // Legacy local PNGs must never enter current APKs, including development builds.
    def artworkSafeAssets = layout.buildDirectory.dir('current-assets')
    def prepareAssets = tasks.register('prepareCurrentAssets', Sync) {
        from 'src/main/assets'
        exclude 'film_icons/grlife/**', 'licenses/GRLife-Film-Icons.txt'
        into artworkSafeAssets
    }
    sourceSets.main.assets.setSrcDirs([artworkSafeAssets.get().asFile])
    tasks.named('preBuild').configure { dependsOn prepareAssets }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    // exifinterface's @RestrictTo annotations need this on the compile classpath; without it javac
    // reports "unknown enum constant Scope.LIBRARY" four times.
    compileOnly 'androidx.annotation:annotation:1.8.1'
}

// Pure Java update-policy tests can also run without AGP/SDK via scripts/test_updates.py.
def updateTestClasses = layout.buildDirectory.dir('update-policy-tests')
tasks.register('compileUpdatePolicyTests', JavaCompile) {
    source 'src/main/java/app/spektrafilm/UpdateManifest.java', 'src/test/java/app/spektrafilm/UpdateManifestTest.java'
    classpath = files()
    destinationDirectory = updateTestClasses
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.encoding = 'UTF-8'
}
tasks.register('testUpdatePolicy', JavaExec) {
    dependsOn 'compileUpdatePolicyTests'
    classpath = files(updateTestClasses)
    mainClass = 'app.spektrafilm.UpdateManifestTest'
}
tasks.named('check').configure { dependsOn 'testUpdatePolicy' }
