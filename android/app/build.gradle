plugins { id 'com.android.application' }

// 签名材料来自 android/keystore.properties（已在 .gitignore 中，不入库）
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// Sponsor artwork stays outside the public source tree. Public builds delete any stale generated
// resource, while local/release builds can inject a private JPEG through Gradle or the environment.
def repositoryRoot = rootProject.projectDir.parentFile
def publicBuild = (findProperty('publicBuild') ?: 'false').toString().toBoolean()
def sponsorQrValue =
        findProperty('sponsorQr') ?: System.getenv('SPEKTRA_SPONSOR_WECHAT_QR')
def sponsorQrWasProvided = sponsorQrValue != null && !sponsorQrValue.toString().isBlank()
def sponsorQrSource
if (sponsorQrWasProvided) {
    File configured = new File(sponsorQrValue.toString())
    sponsorQrSource = configured.isAbsolute() ? configured : new File(repositoryRoot, configured.toString())
} else {
    sponsorQrSource = new File(repositoryRoot, '.local/sponsor/wechat-appreciation.jpg')
}
def sponsorQrEnabled = !publicBuild && sponsorQrSource.isFile()
def sponsorResDir = layout.buildDirectory.dir('generated/sponsor-res')

android {
    namespace 'app.spektrafilm'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'app.spektrafilm'
        minSdk 29
        targetSdk 35
        versionCode 25
        versionName '0.4.6'
        // Default ships arm64 only: the x86_64 SwiftShader ICD alone is 22 MB and phones never use
        // it. Emulator builds pass -Pabis=arm64-v8a,x86_64.
        def abiList = (findProperty('abis') ?: 'arm64-v8a').toString().split(',') as List
        ndk { abiFilters(*abiList) }
        externalNativeBuild { cmake { cppFlags '-std=c++20 -fexceptions -frtti'; arguments '-DANDROID_STL=c++_static' } }
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    packaging { jniLibs { useLegacyPackaging true } }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    // Legacy local PNGs must never enter current APKs, including development builds.
    def artworkSafeAssets = layout.buildDirectory.dir('current-assets')
    def prepareAssets = tasks.register('prepareCurrentAssets', Sync) {
        from 'src/main/assets'
        exclude 'film_icons/grlife/**', 'licenses/GRLife-Film-Icons.txt'
        into artworkSafeAssets
    }
    def prepareSponsorAsset = tasks.register('prepareSponsorAsset') {
        inputs.property('publicBuild', publicBuild)
        inputs.property('sponsorProvided', sponsorQrWasProvided)
        if (sponsorQrEnabled) inputs.file(sponsorQrSource)
        outputs.dir(sponsorResDir)
        doLast {
            File root = sponsorResDir.get().asFile
            delete(root)
            if (publicBuild) return
            if (!sponsorQrSource.isFile()) {
                if (sponsorQrWasProvided) {
                    throw new GradleException(
                            "sponsorQr does not point to a readable file: " + sponsorQrSource)
                }
                return
            }
            DataInputStream input = new DataInputStream(new FileInputStream(sponsorQrSource))
            try {
                if (input.readUnsignedByte() != 0xff || input.readUnsignedByte() != 0xd8) {
                    throw new GradleException("sponsorQr must be a JPEG file")
                }
            } finally {
                input.close()
            }
            File raw = new File(root, 'raw')
            if (!raw.mkdirs() && !raw.isDirectory()) {
                throw new GradleException("Unable to create generated sponsor resource directory")
            }
            copy {
                from sponsorQrSource
                into raw
                rename { 'sponsor_wechat_qr.jpg' }
            }
        }
    }
    sourceSets.main.assets.setSrcDirs([artworkSafeAssets.get().asFile])
    sourceSets.main.res.srcDir(sponsorResDir.get().asFile)
    tasks.named('preBuild').configure { dependsOn prepareAssets, prepareSponsorAsset }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    // exifinterface's @RestrictTo annotations need this on the compile classpath; without it javac
    // reports "unknown enum constant Scope.LIBRARY" four times.
    compileOnly 'androidx.annotation:annotation:1.8.1'
}

// Pure Java update-policy tests can also run without AGP/SDK via scripts/test_updates.py.
def updateTestClasses = layout.buildDirectory.dir('update-policy-tests')
tasks.register('compileUpdatePolicyTests', JavaCompile) {
    source 'src/main/java/app/spektrafilm/UpdateManifest.java',
            'src/main/java/app/spektrafilm/UpdateAvailability.java',
            'src/main/java/app/spektrafilm/UpdateNotes.java',
            'src/test/java/app/spektrafilm/UpdateManifestTest.java',
            'src/test/java/app/spektrafilm/UpdateAvailabilityTest.java',
            'src/test/java/app/spektrafilm/UpdateNotesTest.java'
    classpath = files()
    destinationDirectory = updateTestClasses
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.encoding = 'UTF-8'
}
tasks.register('testUpdatePolicy', JavaExec) {
    dependsOn 'compileUpdatePolicyTests'
    classpath = files(updateTestClasses)
    mainClass = 'app.spektrafilm.UpdateManifestTest'
}
tasks.named('check').configure { dependsOn 'testUpdatePolicy' }

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') }
            && !keystorePropertiesFile.exists()) {
        throw new GradleException("正式包需要 android/keystore.properties，请先配置签名材料")
    }
}
