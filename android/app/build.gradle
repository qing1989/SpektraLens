plugins { id 'com.android.application' }

android {
    namespace 'app.spektrafilm'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'app.spektrafilm'
        minSdk 29
        targetSdk 35
        versionCode 11
        versionName '0.3.2'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++20 -fexceptions -frtti'; arguments '-DANDROID_STL=c++_static' } }
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    packaging { jniLibs { useLegacyPackaging true } }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    if (providers.gradleProperty('publicBuild').getOrElse('false').toBoolean()) {
        def publicAssetsDirectory = layout.buildDirectory.dir('public-assets')
        def publicAssets = tasks.register('preparePublicAssets', Sync) {
            from 'src/main/assets'
            exclude 'film_icons/grlife/**'
            into publicAssetsDirectory
        }
        sourceSets.main.assets.setSrcDirs([publicAssetsDirectory.get().asFile])
        tasks.named('preBuild').configure { dependsOn publicAssets }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}

dependencies { implementation 'androidx.exifinterface:exifinterface:1.4.2' }
